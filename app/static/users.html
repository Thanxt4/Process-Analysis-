<html lang="th">
<head>
<meta charset="utf-8">

<title>Admin · Process Control &amp; GMP</title>
<style>
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:400;src:url(/fonts/sarabun-thai-400-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:500;src:url(/fonts/sarabun-thai-500-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:600;src:url(/fonts/sarabun-thai-600-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:700;src:url(/fonts/sarabun-thai-700-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:400;src:url(/fonts/sarabun-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:500;src:url(/fonts/sarabun-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:600;src:url(/fonts/sarabun-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sarabun';font-style:normal;font-display:swap;font-weight:700;src:url(/fonts/sarabun-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--navy:#1b2a41;--ink:#0f172a;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--amber:#f59e0b;--red:#dc2626;--green:#16a34a;--blue:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Sarabun,"Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:15.5px;line-height:1.45}
button,input,select{font:inherit}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}
/* ---- หน้าเข้าสู่ระบบ Admin ---- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 15% -10%,rgba(245,158,11,.22),transparent 60%),radial-gradient(800px 500px at 110% 110%,rgba(37,99,235,.28),transparent 60%),linear-gradient(160deg,#0f1a2e,#16243d 55%,#0b1424)}
.gcard{width:100%;max-width:400px;background:rgba(255,255,255,.96);border-radius:24px;padding:30px 26px 24px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.gbadge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;background:linear-gradient(135deg,#1b2a41,#2c4a72);color:#fbbf24;box-shadow:0 12px 26px -12px rgba(27,42,65,.8)}
.gbadge .ic{width:28px;height:28px}
.gcard h1{margin:0;text-align:center;font-size:23px;color:var(--navy)}
.gcard p.sub{margin:4px 0 20px;text-align:center;color:var(--muted);font-size:14px}
.fld{position:relative;margin-bottom:12px}
.fld .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 46px 13px 44px;font-size:16px;background:#f8fafc;transition:border-color .15s,background .15s,box-shadow .15s}
.fld input:focus{outline:none;border-color:#3b5b8a;background:#fff;box-shadow:0 0 0 4px rgba(59,91,138,.12)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#94a3b8;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--navy);background:#f1f5f9}
.err{color:var(--red);font-size:13.5px;min-height:19px;margin:2px 0 8px}
.go{width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#1b2a41,#2c4a72);box-shadow:0 14px 28px -14px rgba(27,42,65,.9);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.go:hover{filter:brightness(1.12)}.go:active{transform:scale(.99)}.go:disabled{opacity:.7;cursor:default}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:13.5px;text-decoration:none}.back:hover{color:var(--navy)}
/* ---- หน้าจัดการ ---- */
header{background:linear-gradient(135deg,#0f1a2e,#1b2a41 60%,#24395a);color:#fff;padding:16px 0 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.hrow{display:flex;align-items:center;gap:12px}
.hrow .t{flex:1;min-width:0}
.hrow small{color:#fbbf24;font-weight:800;letter-spacing:.05em;font-size:12px}
.hrow h1{margin:0;font-size:20px}
.hbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.16)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 14px}
.st{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.st:hover{border-color:#cbd5e1}.st.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,65,.08)}
.st b{display:block;font-size:24px;color:var(--navy);line-height:1.1}.st span{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:640px){.stats{grid-template-columns:repeat(3,1fr)}.st b{font-size:20px}}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sx{flex:1;min-width:220px;position:relative}
.sx .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8}
.sx input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px 11px 40px;background:#fff;font-size:15px}
.sx input:focus{outline:none;border-color:var(--navy)}
.add{border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1b2a41,#2c4a72);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:46px minmax(160px,1fr) 70px 80px 150px 70px 360px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #f1f5f9}
.row:first-child{border-top:0}
.row.head{background:#f8fafc;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:none;padding:10px 16px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.nm b{display:block;color:var(--ink);font-size:15.5px}.nm small{color:var(--muted)}
.dp{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px}
.dp.QC{background:#dbeafe;color:#1e40af}.dp.PD{background:#dcfce7;color:#166534}.dp.TP{background:#fef3c7;color:#92400e}
.stt{font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 9px}
.stt.on{background:#dcfce7;color:#166534}.stt.off{background:#fee2e2;color:#991b1b}
.mut{color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;white-space:nowrap}
.ab:hover{border-color:#94a3b8}.ab.red{color:var(--red)}.ab.red:hover{border-color:#fca5a5;background:#fff5f5}
.row.off .nm b{color:#94a3b8;text-decoration:line-through}
@media(max-width:860px){
  .row.head{display:none}
  .row{grid-template-columns:46px 1fr auto;grid-template-areas:"av nm dp" "av meta meta" "acts acts acts";row-gap:6px}
  .row .av{grid-area:av}.row .nm{grid-area:nm}.row .c-dp{grid-area:dp}.row .c-meta{grid-area:meta}.row .acts{grid-area:acts;justify-content:flex-start}
  .row .c-st,.row .c-seen,.row .c-subs{display:none}
}
.c-meta{display:none}@media(max-width:860px){.c-meta{display:block}}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mbox{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:22px 20px 18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.mbox h2{margin:0 0 4px;font-size:19px;color:var(--navy)}.mbox p.mut{margin:0 0 12px}
.lab{display:block;font-weight:700;font-size:13.5px;color:var(--navy);margin:10px 0 5px}
.mbox input,.mbox select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15.5px;background:#fff}
.mbox input:focus,.mbox select:focus{outline:none;border-color:var(--navy)}
.mrow{display:flex;gap:8px;margin-top:16px}.mrow button{flex:1;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--navy)}
.mrow .pri{border:0;background:linear-gradient(135deg,#1b2a41,#2c4a72);color:#fff}.mrow .danger{border:0;background:var(--red);color:#fff}
/* ---- แท็บหน้า Admin ---- */
.vtabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.vtabs button{border:0;background:rgba(255,255,255,.08);color:#cbd5e1;border-radius:11px;padding:8px 16px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.vtabs button.on{background:#fff;color:var(--navy)}
.vtabs button:hover:not(.on){background:rgba(255,255,255,.16);color:#fff}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.sec-h h2{margin:0;font-size:17px;color:var(--navy)}.sec-h small{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
/* ---- ภาพรวมระบบ ---- */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:860px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mk{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.mk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#1b2a41)}
.mk small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.mk b{display:block;font-size:28px;color:var(--navy);line-height:1.2}
.mk span{font-size:12.5px;color:var(--muted)}
.mk.bad b{color:var(--red)}.mk.ok b{color:var(--green)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:860px){.cols2{grid-template-columns:1fr}}
.onl-r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1f5f9}
.onl-r:last-child{border-bottom:0}
.onl-r .av{width:34px;height:34px;border-radius:11px;font-size:12.5px}
.onl-r b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex:none}
.act-r{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.act-r:last-child{border-bottom:0}.act-r .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.act-r .tt{min-width:0}.act-r .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.act-r .tt small{color:var(--muted)}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.ng{background:#fee2e2;color:#b91c1c}.pill.ok{background:#dcfce7;color:#15803d}.pill.na{background:#f1f5f9;color:#475569}
.srv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:14px}
.srv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #e2e8f0;padding:4px 0}.srv span{color:var(--muted)}
.bar2{height:8px;border-radius:99px;background:#f1f5f9;overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
/* ---- ตั้งค่าหน้าบ้าน ---- */
.tg{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.tg:last-child{border-bottom:0}
.tg .tx{flex:1;min-width:0}.tg .tx b{display:block}.tg .tx small{color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:#cbd5e1;transition:.15s;cursor:pointer}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw input:checked+i{background:#16a34a}.sw input:checked+i::after{transform:translateX(22px)}
.sw input:disabled+i{opacity:.5;cursor:default}
.bnr textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;min-height:70px;resize:vertical}
.tones{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tones button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer}
.tones button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.prev{display:flex;gap:10px;padding:11px 14px;border-radius:14px;font-weight:600;border:1px solid}
.prev.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.prev.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.prev.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}.prev.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.savebar{position:sticky;bottom:12px;margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:rgba(241,245,249,.92);padding:10px;border-radius:16px;backdrop-filter:blur(6px)}
.savebar .pri{border:0;border-radius:12px;padding:11px 20px;font-weight:800;color:#fff;background:var(--navy);cursor:pointer}
.savebar .pri:disabled{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
</style>
</head>
<body>
<!-- เข้าสู่ระบบ Admin -->
<div class="gate" id="gate" hidden><form class="gcard" id="gForm" autocomplete="off">
  <div class="gbadge"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></div>
  <h1>ผู้ดูแลระบบ (Admin)</h1>
  <p class="sub">สำหรับผู้ดูแลระบบ · เข้าครั้งเดียว เครื่องนี้จำไว้จนกว่าจะออกจากระบบ</p>
  <div class="fld"><svg class="ic lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input type="password" id="gPw" placeholder="รหัส Admin" autocomplete="current-password" required>
    <button type="button" class="eye" data-eye="gPw" aria-label="แสดงรหัส"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <p class="err" id="gErr"></p>
  <button class="go" id="gGo" type="submit">เข้าสู่ระบบ Admin</button>
  <a class="back" href="/">← กลับหน้าหลัก</a>
</form></div>

<!-- หน้าจัดการ -->
<div id="app" hidden>
<header><div class="wrap hrow">
  <div class="t"><small>PROCESS CONTROL &amp; GMP / ADMIN</small><h1 id="vTitle">ภาพรวมระบบ</h1></div>
  <a class="hbtn" href="/">หน้าหลัก</a><button class="hbtn" id="out" type="button">ออกจากระบบ Admin</button>
</div>
<div class="wrap"><nav class="vtabs" id="vtabs"><button data-v="mon" class="on">ภาพรวมระบบ</button><button data-v="users">ผู้ใช้</button><button data-v="site">ตั้งค่าหน้าบ้าน</button></nav></div></header>
<main class="wrap" id="v-mon"><div id="mon"><div class="empty">กำลังโหลด…</div></div></main>
<main class="wrap" id="v-site" hidden><div id="site"><div class="empty">กำลังโหลด…</div></div></main>
<main class="wrap" id="v-users" hidden>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="sx"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="ค้นหา ชื่อ / รหัสพนักงาน" autocomplete="off"></div>
    <button class="add" id="addBtn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>เพิ่มผู้ใช้</button>
  </div>
  <div class="list" id="list"></div>
  <p class="mut" style="margin:12px 2px 40px">เปลี่ยนชื่อแล้ว ผลตรวจที่ส่งไปก่อนหน้ายังแสดงชื่อเดิม · ระงับบัญชี = เข้าสู่ระบบไม่ได้และออกจากทุกเครื่องทันที</p>
</main>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const toast = (m, err) => { const t = $("#toast"); t.textContent = m; t.className = "toast on" + (err ? " err" : ""); clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", 2600); };
const S = { users: [], depts: ["QC", "PD", "TP"], f: "all", q: "" };
async function api(url, opt){ const r = await fetch(url, opt); const j = await r.json().catch(() => ({}));
  if(r.status === 401 && j.detail === "ADMIN_REQUIRED"){ showGate(); throw new Error("ต้องเข้าสู่ระบบ Admin"); }
  if(!r.ok) throw new Error(j.detail || "ไม่สำเร็จ"); return j; }
const jpost = (url, body, method = "POST") => api(url, {method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
document.addEventListener("click", e => { const b = e.target.closest("[data-eye]"); if(!b) return; const i = document.getElementById(b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; i.focus(); });
function showGate(){ $("#app").hidden = true; $("#gate").hidden = false; setTimeout(() => $("#gPw").focus(), 50); }
$("#gForm").onsubmit = async e => { e.preventDefault(); const b = $("#gGo"); b.disabled = true; b.innerHTML = `<span class="spin"></span>กำลังตรวจสอบ…`; $("#gErr").textContent = "";
  try{ await jpost("/api/uadmin/login", {password: $("#gPw").value}); $("#gPw").value = ""; await load(); }
  catch(err){ $("#gErr").textContent = err.message; $("#gPw").select(); }
  finally{ b.disabled = false; b.textContent = "เข้าสู่ระบบ Admin"; } };
$("#out").onclick = async () => { if(!confirm("ออกจากระบบ Admin?")) return; await fetch("/api/uadmin/logout", {method: "POST"}); showGate(); };
const COLORS = ["#2563eb", "#7c3aed", "#db2777", "#ea580c", "#16a34a", "#0891b2", "#4f46e5", "#b45309"];
const avColor = s => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const ini = n => { const w = String(n).trim().split(/\s+/); return (w[0] || "?").slice(0, 2).toUpperCase(); };
const ago = ms => { if(!ms) return "ยังไม่เคยเข้า"; const m = Math.round((Date.now() - ms) / 6e4); return m < 60 ? "ใช้งานเมื่อสักครู่" : m < 1440 ? `${Math.round(m / 60)} ชม.ที่แล้ว` : m < 43200 ? `${Math.round(m / 1440)} วันที่แล้ว` : new Date(ms).toLocaleDateString("th-TH"); };
async function load(){
  const r = await api("/api/uadmin/users"); S.users = r.users; S.depts = r.depts || S.depts;
  const first = $("#app").hidden; $("#gate").hidden = true; $("#app").hidden = false;
  if(first) showView(VIEW); else render();
}
function render(){
  const U = S.users, cnt = k => k === "all" ? U.length : k === "off" ? U.filter(u => !u.active).length : U.filter(u => u.dept === k).length;
  $("#stats").innerHTML = [["all", "ทั้งหมด"], ...S.depts.map(d => [d, d]), ["off", "ระงับ"]].map(([k, l]) => `<div class="st ${S.f === k ? "on" : ""}" data-f="${k}"><b>${cnt(k)}</b><span>${l}</span></div>`).join("");
  const q = S.q.trim().toLowerCase();
  const L = U.filter(u => (S.f === "all" || (S.f === "off" ? !u.active : u.dept === S.f)) && (!q || `${u.name} ${u.emp_id}`.toLowerCase().includes(q)));
  $("#list").innerHTML = L.length ? `<div class="row head"><span></span><span>ชื่อ / รหัสพนักงาน</span><span>แผนก</span><span>สถานะ</span><span>ใช้งานล่าสุด</span><span>ผลตรวจ</span><span></span></div>` + L.map(u => `
    <div class="row ${u.active ? "" : "off"}" data-emp="${esc(u.emp_id)}">
      <div class="av" style="background:${avColor(u.name)}">${esc(ini(u.name))}</div>
      <div class="nm"><b>${esc(u.name)}</b><small>${esc(u.emp_id)}</small></div>
      <div class="c-dp"><span class="dp ${esc(u.dept)}">${esc(u.dept)}</span></div>
      <div class="c-st"><span class="stt ${u.active ? "on" : "off"}">${u.active ? "ใช้งาน" : "ระงับ"}</span></div>
      <div class="c-seen mut">${ago(u.last_seen)}${u.devices ? ` · ${u.devices} เครื่อง` : ""}</div>
      <div class="c-subs mut">${u.subs} ครั้ง</div>
      <div class="c-meta mut">${u.active ? "" : "ระงับ · "}${ago(u.last_seen)} · ผลตรวจ ${u.subs} ครั้ง</div>
      <div class="acts"><button class="ab" data-a="edit">แก้ไข</button><button class="ab" data-a="pw">ตั้งรหัสใหม่</button>${u.devices ? `<button class="ab" data-a="kick">ออกทุกเครื่อง</button>` : ""}
        <button class="ab ${u.active ? "red" : ""}" data-a="toggle">${u.active ? "ระงับ" : "เปิดใช้"}</button><button class="ab red" data-a="del">ลบ</button></div>
    </div>`).join("") : `<div class="empty">${U.length ? "ไม่พบผู้ใช้ที่ค้นหา" : "ยังไม่มีผู้ใช้ · ผู้ใช้สมัครเองได้ที่หน้าหลัก หรือกด เพิ่มผู้ใช้"}</div>`;
}
function modal(html, wire){ $("#modal").innerHTML = `<div class="mbg"><form class="mbox" autocomplete="off">${html}</form></div>`; const f = $("#modal form");
  $("#modal .mbg").addEventListener("click", e => { if(e.target.classList.contains("mbg")) close(); }); f.querySelectorAll("[data-close]").forEach(b => b.onclick = close); wire(f); const i = f.querySelector("input"); if(i) setTimeout(() => i.focus(), 40); }
const close = () => $("#modal").innerHTML = "";
const deptSel = v => `<select name="dept" required>${S.depts.map(d => `<option ${d === v ? "selected" : ""}>${d}</option>`).join("")}</select>`;
const pwFld = (n, ph) => `<div class="fld" style="margin:0"><input type="password" name="${n}" id="f_${n}" placeholder="${ph}" minlength="6" required style="padding-left:14px"><button type="button" class="eye" data-eye="f_${n}" aria-label="แสดงรหัส"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>`;
const submit = (f, fn) => f.onsubmit = async e => { e.preventDefault(); const b = f.querySelector(".pri,.danger"); if(b) b.disabled = true; try{ await fn(new FormData(f)); close(); await load(); }catch(err){ toast(err.message, true); if(b) b.disabled = false; } };
$("#addBtn").onclick = () => modal(`<h2>เพิ่มผู้ใช้</h2><p class="mut">ผู้ใช้เปลี่ยนรหัสผ่านเองได้ภายหลัง (ผ่านหัวหน้า/Admin)</p>
  <label class="lab">ชื่อ</label><input name="name" required maxlength="60"><label class="lab">รหัสพนักงาน</label><input name="emp_id" required maxlength="20" autocapitalize="off">
  <label class="lab">แผนก</label>${deptSel("QC")}<label class="lab">รหัสผ่านเริ่มต้น</label>${pwFld("password", "อย่างน้อย 6 ตัว")}
  <div class="mrow"><button type="button" data-close>ยกเลิก</button><button class="pri" type="submit">เพิ่มผู้ใช้</button></div>`,
  f => submit(f, async fd => { await jpost("/api/uadmin/users", Object.fromEntries(fd)); toast("เพิ่มผู้ใช้แล้ว"); }));
$("#stats").addEventListener("click", e => { const c = e.target.closest("[data-f]"); if(c){ S.f = c.dataset.f; render(); } });
$("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if(!b) return; const emp = b.closest("[data-emp]").dataset.emp, u = S.users.find(x => x.emp_id === emp), url = `/api/uadmin/users/${encodeURIComponent(emp)}`;
  if(b.dataset.a === "edit") modal(`<h2>แก้ไขผู้ใช้</h2><p class="mut">รหัสพนักงาน ${esc(u.emp_id)}</p><label class="lab">ชื่อ</label><input name="name" value="${esc(u.name)}" required maxlength="60"><label class="lab">แผนก</label>${deptSel(u.dept)}
      <div class="mrow"><button type="button" data-close>ยกเลิก</button><button class="pri" type="submit">บันทึก</button></div>`, f => submit(f, async fd => { await jpost(url, Object.fromEntries(fd)); toast("บันทึกแล้ว"); }));
  else if(b.dataset.a === "pw") modal(`<h2>ตั้งรหัสผ่านใหม่</h2><p class="mut">${esc(u.name)} · ${esc(u.emp_id)} · จะออกจากระบบทุกเครื่องของคนนี้</p>${pwFld("password", "รหัสผ่านใหม่ อย่างน้อย 6 ตัว")}
      <div class="mrow"><button type="button" data-close>ยกเลิก</button><button class="pri" type="submit">ตั้งรหัสใหม่</button></div>`, f => submit(f, async fd => { await jpost(url, {password: fd.get("password")}); toast("ตั้งรหัสผ่านใหม่แล้ว"); }));
  else if(b.dataset.a === "kick"){ if(!confirm(`ให้ ${u.name} ออกจากระบบทุกเครื่อง?`)) return; try{ await jpost(url, {logout: true}); toast("ออกจากระบบทุกเครื่องแล้ว"); await load(); }catch(err){ toast(err.message, true); } }
  else if(b.dataset.a === "toggle"){ if(!confirm(`${u.active ? "ระงับ" : "เปิดใช้"}บัญชี ${u.name}?`)) return; try{ await jpost(url, {active: !u.active}); toast(u.active ? "ระงับบัญชีแล้ว" : "เปิดใช้บัญชีแล้ว"); await load(); }catch(err){ toast(err.message, true); } }
  else if(b.dataset.a === "del") modal(`<h2>ลบผู้ใช้</h2><p class="mut">ลบบัญชี <b>${esc(u.name)}</b> (${esc(u.emp_id)}) · ผลตรวจที่เคยส่งยังอยู่ครบ · ถ้าแค่ไม่ให้ใช้งาน แนะนำ "ระงับ" แทน</p>
      <div class="mrow"><button type="button" data-close>ยกเลิก</button><button class="danger" type="submit">ลบผู้ใช้</button></div>`, f => submit(f, async () => { await api(url, {method: "DELETE"}); toast("ลบผู้ใช้แล้ว"); }));
});
/* ---------- แท็บของหน้า Admin ---------- */
const VIEWS = { mon: "ภาพรวมระบบ", users: "จัดการผู้ใช้", site: "ตั้งค่าหน้าบ้าน" };
let VIEW = localStorage.getItem("adm_view") || "mon"; if(!VIEWS[VIEW]) VIEW = "mon";
function showView(v){
  VIEW = v; localStorage.setItem("adm_view", v); $("#vTitle").textContent = VIEWS[v];
  document.querySelectorAll("#vtabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  Object.keys(VIEWS).forEach(k => $("#v-" + k).hidden = k !== v);
  if(v === "mon") loadMon(); else if(v === "site") loadSiteCfg(); else if(v === "users") render();
  window.scrollTo(0, 0);
}
$("#vtabs").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if(b){ if(VIEW === "site" && SITE.dirty && !confirm("ยังไม่ได้บันทึกการตั้งค่า ออกจากหน้านี้?")) return; SITE.dirty = false; showView(b.dataset.v); } });

/* ---------- ภาพรวมระบบ (อัปเดตทุก 30 วินาที) ---------- */
const fmtB = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " KB";
const upTxt = ms => { const m = Math.floor(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return d ? `${d} วัน ${h} ชม.` : h ? `${h} ชม. ${m % 60} นาที` : `${m} นาที`; };
const TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thD = iso => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${TH_M[m - 1]} ${y + 543}`; };
async function loadMon(){
  let M; try{ M = await api("/api/uadmin/monitor"); }catch(err){ $("#mon").innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  const R = M.round_stats, F = M.followups, T = M.retort, V = M.server, ng = R.subs ? Math.round(R.ng / R.subs * 100) : 0;
  const mk = (lab, val, sub, c, cls = "") => `<div class="mk ${cls}" style="--c:${c}"><small>${lab}</small><b>${val}</b><span>${sub}</span></div>`;
  const used = V.disk_total ? (V.disk_total - V.disk_free) / V.disk_total * 100 : 0;
  const off = Object.entries({...M.site.tabs, ...M.site.feats}).filter(([, v]) => v === false).length;
  $("#mon").innerHTML = `
    <div class="sec-h"><h2>รอบ ${thD(M.round)}</h2><small>ตัดรอบ ${esc(M.cutoff)} น. · อัปเดต ${new Date(M.now).toLocaleTimeString("th-TH", {hour: "2-digit", minute: "2-digit", second: "2-digit"})}</small></div>
    <div class="mgrid">
      ${mk("ออนไลน์ตอนนี้", M.online.length, `ผู้ใช้ทั้งหมด ${M.users.active}/${M.users.total} · ใช้ใน 7 วัน ${M.users.active7}`, "#16a34a", M.online.length ? "ok" : "")}
      ${mk("ผลตรวจรอบนี้", R.subs, `ผู้ตรวจ ${R.inspectors} คน · หัวข้อทั้งหมด ${R.items}`, "#2563eb")}
      ${mk("พบปัญหารอบนี้", R.ng, `${ng}% ของผลตรวจ · คอมเมนต์ ${R.comments}`, "#dc2626", R.ng ? "bad" : "ok")}
      ${mk("เรื่องที่ต้องติดตาม (ค้าง)", F.open, `เกินกำหนด ${F.over} · ด่วน ${F.urgent}`, "#f59e0b", F.over ? "bad" : "")}
      ${mk("ปัญหา Retort วันนี้", T.today, `ทั้งหมด ${T.all} รายการ`, "#7c3aed", T.today ? "bad" : "")}
      ${mk("รอบหม้อที่กรอกวันนี้", T.cycles, `${T.runs_rows} ช่อง (หม้อ × กะ)`, "#0891b2")}
      ${mk("Retort Survey", T.surveys, "แบบฟอร์มที่บันทึกไว้", "#475569")}
      ${mk("ฟีเจอร์ที่ปิดอยู่", off, off ? "ดู/แก้ที่แท็บ ตั้งค่าหน้าบ้าน" : "เปิดครบทุกฟีเจอร์", "#64748b")}
    </div>
    <div class="cols2" style="margin-top:12px">
      <div class="card"><div class="sec-h" style="margin-top:0"><h2>ใครออนไลน์</h2><small>ใช้งานภายใน 3 นาที</small></div>
        ${M.online.length ? M.online.map(u => `<div class="onl-r"><div class="av" style="background:${avColor(u.name)}">${esc(ini(u.name))}</div><b>${esc(u.name)}</b><span class="dp ${esc(u.dept)}">${esc(u.dept)}</span><span class="dot"></span></div>`).join("") : `<div class="mut">ไม่มีใครออนไลน์ตอนนี้</div>`}</div>
      <div class="card"><div class="sec-h" style="margin-top:0"><h2>ผลตรวจล่าสุด</h2><small>15 รายการล่าสุด</small></div>
        ${M.recent.length ? M.recent.map(r => `<div class="act-r"><span class="tm">${esc((r.created_at || "").slice(11, 16))}</span><div class="tt"><b>${esc(r.title)}</b><small>${esc(r.zone)} · ${esc(r.inspector)}${r.round_date !== M.round ? ` · รอบ ${thD(r.round_date)}` : ""}</small></div>
          <span class="pill ${r.status === "พบปัญหา" ? "ng" : r.status === "ปกติ" ? "ok" : "na"}">${esc(r.status)}</span></div>`).join("") : `<div class="mut">ยังไม่มีผลตรวจ</div>`}</div>
    </div>
    <div class="card"><div class="sec-h" style="margin-top:0"><h2>เซิร์ฟเวอร์</h2><small>${esc(V.data_dir)}</small></div>
      <div class="srv"><div><span>เปิดมาแล้ว</span><b>${upTxt(M.now - V.started)}</b></div><div><span>ฐานข้อมูล</span><b>${fmtB(V.db_bytes)}</b></div>
        <div><span>รูปภาพ</span><b>${fmtB(V.uploads_bytes)} · ${V.uploads_files.toLocaleString()} ไฟล์</b></div><div><span>พื้นที่ว่างในดิสก์</span><b>${fmtB(V.disk_free)} / ${fmtB(V.disk_total)}</b></div></div>
      <div class="bar2" title="ใช้ไปแล้ว ${Math.round(used)}%"><i style="width:${used.toFixed(1)}%"></i></div>
      <div class="mut" style="margin-top:4px">ใช้ดิสก์ไปแล้ว ${Math.round(used)}%${used > 90 ? " · ใกล้เต็ม ควรย้ายรูปเก่าไปคลัง" : ""}</div></div>`;
}
setInterval(() => { if(VIEW === "mon" && !document.hidden && !$("#app").hidden) loadMon(); }, 30000);

/* ---------- ตั้งค่าหน้าบ้าน ---------- */
const SITE = { cur: null, dirty: false };
const TAB_L = { form: ["กรอกฟอร์ม", "หน้าบันทึกผลตรวจ"], check: ["Checklist", "สถานะการตรวจของแต่ละพื้นที่ · สรุปที่ยังไม่ส่ง"], follow: ["เรื่องที่ต้องติดตาม", "รายการเรื่องค้าง · ตอบสาเหตุ/การแก้ไข"], slides: ["สไลด์", "ดาวน์โหลด/สร้างสไลด์"] };
const FEAT_L = { bell: ["กระดิ่งแจ้งเตือน", "หน้าหลัก และหน้า Retort"], online: ["ปุ่ม \"ออนไลน์\" (ดูว่าใครออนไลน์)", "หน้าหลัก และหน้า Retort"], search: ["ปุ่มค้นหา", "ค้นหาทุกอย่างในหน้าหลัก"],
  comments: ["ถาม-ตอบ / คอมเมนต์ใต้ผลตรวจ", "ซ่อนกล่องคอมเมนต์และป้ายถาม-ตอบ"], followbtn: ["ปุ่ม \"＋ ติดตาม\"", "ปุ่มเพิ่มผลตรวจไปเรื่องที่ต้องติดตาม"],
  retort: ["หน้า Retort Analysis", "ปิดแล้ว: ซ่อนการ์ด Retort ในหน้าหลัก และหน้า Retort จะขึ้นว่าปิดชั่วคราว"], install: ["ปุ่ม \"ติดตั้งแอป\"", "ปุ่มติดตั้งบนมือถือ"] };
const TONES = [["info", "แจ้งข่าว (ฟ้า)"], ["warn", "เตือน (เหลือง)"], ["bad", "สำคัญ (แดง)"], ["ok", "ปกติ (เขียว)"]];
async function loadSiteCfg(){ try{ SITE.cur = await api("/api/uadmin/site"); SITE.dirty = false; drawSite(); }catch(err){ $("#site").innerHTML = `<div class="empty">${esc(err.message)}</div>`; } }
function drawSite(){
  const c = SITE.cur, sw = (grp, k, L) => `<label class="tg"><div class="tx"><b>${esc(L[0])}</b><small>${esc(L[1])}</small></div><span class="sw"><input type="checkbox" data-g="${grp}" data-k="${k}" ${c[grp][k] ? "checked" : ""}><i></i></span></label>`;
  $("#site").innerHTML = `
    <div class="sec-h"><h2>แถบในหน้าหลัก</h2><small>ปิดแล้วแถบนั้นจะไม่แสดงในทุกเครื่อง (ภายใน 2 นาที หรือเมื่อรีเฟรช)</small></div>
    <div class="card">${Object.keys(TAB_L).map(k => sw("tabs", k, TAB_L[k])).join("")}</div>
    <div class="sec-h"><h2>ฟีเจอร์</h2><small>เปิด/ปิดได้ทันที ข้อมูลไม่หาย</small></div>
    <div class="card">${Object.keys(FEAT_L).map(k => sw("feats", k, FEAT_L[k])).join("")}</div>
    <div class="sec-h"><h2>ประกาศแถบบน</h2><small>แสดงใต้หัวหน้าหลัก และหน้า Retort</small></div>
    <div class="card bnr"><label class="tg" style="padding-top:0"><div class="tx"><b>แสดงประกาศ</b><small>เช่น แจ้งปิดปรับปรุงระบบ แจ้งเปลี่ยนขั้นตอน</small></div><span class="sw"><input type="checkbox" id="bnOn" ${c.banner.on ? "checked" : ""}><i></i></span></label>
      <textarea id="bnTx" maxlength="300" placeholder="ข้อความประกาศ (ไม่เกิน 300 ตัวอักษร)">${esc(c.banner.text)}</textarea>
      <div class="tones">${TONES.map(([v, l]) => `<button type="button" data-tone="${v}" class="${c.banner.tone === v ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="prev ${c.banner.tone}" id="bnPrev">${esc(c.banner.text || "ตัวอย่างประกาศ")}</div></div>
    <div class="savebar"><span class="mut" id="siteSt">${c.updated_at ? `บันทึกล่าสุด ${new Date(c.updated_at).toLocaleString("th-TH")}` : "ยังไม่เคยแก้ไข · ใช้ค่าเริ่มต้น (เปิดทุกอย่าง)"}</span><button class="pri" id="siteSave" disabled>บันทึกการตั้งค่า</button></div>`;
}
const siteDirty = () => { SITE.dirty = true; $("#siteSave").disabled = false; $("#siteSt").textContent = "ยังไม่ได้บันทึก"; };
$("#site").addEventListener("change", e => { const t = e.target, c = SITE.cur; if(!c) return;
  if(t.dataset.g){ c[t.dataset.g][t.dataset.k] = t.checked; if(t.dataset.g === "tabs" && !Object.values(c.tabs).some(Boolean)){ t.checked = true; c.tabs[t.dataset.k] = true; toast("ต้องเปิดอย่างน้อย 1 แถบ", true); return; } siteDirty(); }
  else if(t.id === "bnOn"){ c.banner.on = t.checked; siteDirty(); } });
$("#site").addEventListener("input", e => { if(e.target.id === "bnTx" && SITE.cur){ SITE.cur.banner.text = e.target.value; $("#bnPrev").textContent = e.target.value || "ตัวอย่างประกาศ"; siteDirty(); } });
$("#site").addEventListener("click", async e => { const b = e.target.closest("button"); if(!b || !SITE.cur) return;
  if(b.dataset.tone){ SITE.cur.banner.tone = b.dataset.tone; document.querySelectorAll("[data-tone]").forEach(x => x.classList.toggle("on", x === b)); $("#bnPrev").className = "prev " + b.dataset.tone; siteDirty(); }
  else if(b.id === "siteSave"){ b.disabled = true; try{ SITE.cur = await jpost("/api/uadmin/site", SITE.cur); SITE.dirty = false; drawSite(); toast("บันทึกการตั้งค่าแล้ว · ทุกเครื่องจะเห็นภายใน 2 นาที"); }catch(err){ b.disabled = false; toast(err.message, true); } } });
addEventListener("beforeunload", e => { if(SITE.dirty){ e.preventDefault(); e.returnValue = ""; } });
(async () => { try{ const r = await fetch("/api/uadmin/me"); const j = await r.json(); if(j.admin) await load(); else showGate(); }catch{ showGate(); } })();
</script>
</body>
</html>
